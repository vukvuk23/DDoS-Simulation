apiVersion: apps/v1
kind: Deployment                    
metadata:
  name: notifier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifier
  template:
    metadata:
      labels:
        app: notifier
    spec:
      containers:
        - name: notifier
          image: notifier:latest
          imagePullPolicy: Never                    
          ports:
            - containerPort: 9000
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            periodSeconds: 10
            failureThreshold: 3

---

apiVersion: v1
kind: Service                       
metadata:
  name: notifier
spec:
  selector:
    app: notifier
  ports:
    - port: 9000
      targetPort: 9000