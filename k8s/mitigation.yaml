apiVersion: v1
kind: ServiceAccount        # identitet pod kojim ce mitigation pod da se predstavi k8s apiju
metadata:
  name: mitigation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role                  # skup dozvola
metadata:
  name: mitigation-scaler
rules:
  - apiGroups: ["traefik.io"]                      # DODATO: dozvola za CRD koji Traefik koristi za rate limiting
    resources: ["middlewares"]                       # konkretan resurs (Middleware) koji mitigation servis sme da menja
    verbs: ["get", "patch"]                           # cita trenutno stanje i menja average/burst parametre
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding            # povezuje ServiceAccount sa rolom iznad
metadata:
  name: mitigation-scaler-binding
subjects:
  - kind: ServiceAccount
    name: mitigation
    namespace: default
roleRef:
  kind: Role
  name: mitigation-scaler
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mitigation-traefik-scaler
  namespace: kube-system
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["traefik"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mitigation-traefik-scaler-binding
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: mitigation
    namespace: default
roleRef:
  kind: Role
  name: mitigation-traefik-scaler
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mitigation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mitigation
  template:
    metadata:
      labels:
        app: mitigation
    spec:
      serviceAccountName: mitigation   #  bez ovoga pod koristi default, koji nema dozvolu za patch
      containers:
        - name: mitigation
          image: mitigation:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8001
          env:                                           
            - name: MANUAL_OVERRIDE_SECONDS                  
              value: "120"
            - name: MIDDLEWARE_NAME                           
              value: "target-ratelimit"
            - name: TRAEFIK_DEPLOYMENT_NAME
              value: "traefik"
            - name: TRAEFIK_NAMESPACE
              value: "kube-system"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mitigation
spec:
  selector:
    app: mitigation
  ports:
    - port: 8001
      targetPort: 8001