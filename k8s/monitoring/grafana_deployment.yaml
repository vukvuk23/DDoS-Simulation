apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1  
  selector:
    matchLabels:
      app: grafana     
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0   
          ports:
            - containerPort: 3000 
          volumeMounts:
            - name: datasources-volume
              mountPath: /etc/grafana/provisioning/datasources
            - name: alerting-volume                          
              mountPath: /etc/grafana/provisioning/alerting     
      volumes:
        - name: datasources-volume
          configMap:
            name: grafana-datasources
        - name: alerting-volume                              
          configMap:
            name: grafana-alerting