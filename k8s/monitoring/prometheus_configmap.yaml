apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config    
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s  
      evaluation_interval: 15s
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'target-pods'                                       
        kubernetes_sd_configs:
          - role: pod                                                  
            namespaces:
              names: ['default']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: target                                              
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod                                          
          - source_labels: [__address__]
            action: replace
            regex: '([^:]+)(?::\d+)?'
            replacement: '${1}:5000'                                 
            target_label: __address__

      - job_name: 'traefik'
        static_configs:
          - targets: ['traefik-metrics.kube-system:9100']

      - job_name: 'detection'
        static_configs:
          - targets: ['detection:8000']

      - job_name: 'mitigation'
        static_configs:
          - targets: ['mitigation:8001']