apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config    
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s  
      evaluation_interval: 15s
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'target'
        static_configs:
          - targets: ['target:80']

      - job_name: 'traefik'
        static_configs:
          - targets: ['traefik-metrics.kube-system:9100']

      - job_name: 'detection'
        static_configs:
          - targets: ['detection:8000']

      - job_name: 'mitigation'
        static_configs:
          - targets: ['mitigation:8001']