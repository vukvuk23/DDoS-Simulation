apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus           
spec:
  replicas: 1 
  selector: 
    matchLabels:
      app: prometheus           
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.0.1
          args:
            - "--config.file=/etc/prometheus/prometheus.yml" # docker run
            - "--storage.tsdb.path=/prometheus"
          ports:
            - containerPort: 9090
          volumeMounts: # gde su u kontejneru volumeni
            - name: config-volume     
              mountPath: /etc/prometheus 
            - name: storage-volume
              mountPath: /prometheus
      volumes: # sta su, odakle im sadrzaj dolazi
        - name: config-volume
          configMap:
            name: prometheus-config   # referenca na ConfigMap iz prometheus-configmap.yaml 
        - name: storage-volume
          emptyDir: {}