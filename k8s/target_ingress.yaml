apiVersion: networking.k8s.io/v1 
kind: Ingress # "pravila rutiranja"
metadata:
  name: target 
spec:
  ingressClassName: traefik # ingress controler, vec ugradjeno
  rules: 
    - host: target.local # pravilo se primenjuje ako je host header ovaj
      http:
        paths: 
          - path: / 
            pathType: Prefix # svaka ruta koja pocinje sa /
            backend: # kuda se prosledjuje
              service: # sve iz target.yaml
                name: target 
                port:
                  number: 80