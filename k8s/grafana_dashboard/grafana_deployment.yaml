apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1  
  selector:
    matchLabels:
      app: grafana     
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0   
          ports:
            - containerPort: 3000 
          volumeMounts:
            - name: datasources-volume
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider-volume
              mountPath: /etc/grafana/provisioning/dashboards
              # ovde Grafana čita KAKO da učita dashboard-e (provider config) - ne same dashboard-e
            - name: dashboard-target-volume
              mountPath: /var/lib/grafana/dashboards
              # ovde Grafana čita SAM dashboard JSON, prateći putanju iz providera iznad
      volumes:
        - name: datasources-volume
          configMap:
            name: grafana-datasources
        - name: dashboards-provider-volume
          configMap:
            name: grafana-dashboards-provider
        - name: dashboard-target-volume
          configMap:
            name: grafana-dashboard-target
